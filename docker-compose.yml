version: '3.8'

services:
  # 1. Service Discovery (Consul)
  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client 0.0.0.0"
    networks:
      - lab-network

  # 2. Auth-сервис (сервис: auth)
  auth:
    build:
      context: ./auth_service
    container_name: auth
    expose:
      - "5000"
    environment:
      - PORT=5000
      - SERVICE_HOST=auth
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - JWT_SECRET=super-secret-key-student-lab-2
    depends_on:
      - consul
    networks:
      - lab-network

  # 3. Первый инстанс Catalog-сервиса (сервис: catalog-1)
  catalog-1:
    build:
      context: ./catalog_service
    container_name: catalog-1
    expose:
      - "5000"
    environment:
      - PORT=5000
      - SERVICE_HOST=catalog-1
      - INSTANCE_NAME=catalog-1
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - DB_PATH=/data/products.db
    volumes:
      - catalog-data:/data
    depends_on:
      - consul
    networks:
      - lab-network

  # 4. Второй инстанс Catalog-сервиса (сервис: catalog-2)
  # Использует тот же контекст/образ, но другие переменные окружения
  catalog-2:
    build:
      context: ./catalog_service
    container_name: catalog-2
    expose:
      - "5000"
    environment:
      - PORT=5000
      - SERVICE_HOST=catalog-2
      - INSTANCE_NAME=catalog-2
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - DB_PATH=/data/products.db
    volumes:
      - catalog-data:/data
    depends_on:
      - consul
    networks:
      - lab-network

  # 5. API Gateway на базе Nginx (сервис: nginx)
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      - auth
      - catalog-1
      - catalog-2
    networks:
      - lab-network

volumes:
  catalog-data:

networks:
  lab-network:
    driver: bridge
