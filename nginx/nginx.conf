events {
    worker_connections 1024;
}

http {
    # 1. Сервис авторизации (имя контейнера в docker-compose: auth)
    upstream auth_service {
        server auth:5000;
    }

    # 2. Upstream для Catalog-сервиса с обоими инстансами (Round-Robin балансировка)
    upstream catalog_cluster {
        server catalog-1:5000 max_fails=1 fail_timeout=10s;
        server catalog-2:5000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        add_header X-Gateway "Nginx-API-Gateway" always;

        # Проксирование путей /auth/ на Auth-сервис
        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Проксирование путей /catalog/ на upstream Catalog-сервиса
        location /catalog/ {
            proxy_pass http://catalog_cluster/;
            
            # Отказоустойчивость: если catalog-1 выключен, запрос сразу перенаправляется на catalog-2
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /catalog {
            return 301 /catalog/;
        }

        # Health check API Gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"Nginx API Gateway"}';
        }
    }
}
